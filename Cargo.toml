[package]
name = "vhsify"
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
image = { version = "0.25.10", features = ["avif", "avif-native"] }
kamadak-exif = "0.6.1"
ntsc-rs = { git = "https://github.com/ntsc-rs/ntsc-rs", tag = "v0.9.7", default-features = false, features = ["std"] }
rayon = "1.11.0"
hound = "3.5.1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.6", default-features = false }

[target.'cfg(not(unix))'.dependencies]
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"

# テストでも画像処理が速く動くよう、依存クレートだけは最適化してビルドする
[profile.dev.package."*"]
opt-level = 3
