name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dav1d and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev ffmpeg

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  # リリースでは Windows 版も配布しているので、Windows でしかコンパイルされない部分も確かめる
  windows:
    runs-on: windows-latest
    env:
      # dav1d-sys は pkg-config で dav1d を探す。どちらも vcpkg で入れる
      PKG_CONFIG: C:/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe
      PKG_CONFIG_PATH: C:/vcpkg/installed/x64-windows-static-md/lib/pkgconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # vcpkg はソースからビルドし、3 分ほどかかるのでキャッシュする。キャッシュがあれば外部から何も取得しない
      - name: Cache vcpkg packages
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-dav1d-x64-windows-static-md-pkgconf-x64-windows

      - name: Install dav1d and pkg-config
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install dav1d:x64-windows-static-md pkgconf:x64-windows

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # ffmpeg は入れないので、動画のテストは外す
      - name: Run tests
        run: cargo test --bins --test cli --test image

  auto-merge:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'oborodice/vhsify'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge
        uses: oborodice/dependabot-auto-merge@v2
        with:
          update-types: patch,minor
